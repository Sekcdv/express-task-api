services:
- type: web
name: task-api-express-reemplaza
runtime: node
plan: free
buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
startCommand: pnpm start
healthCheckPath: /health/database
maxShutdownDelaySeconds: 30
envVars:
- key: NODE_VERSION
value: 24.21.0
- key: NODE_ENV
value: production
- key: APP_VERSION
value: 1.0.0
- key: PUBLIC_API_URL
value: https://joseph-github-io-e4k2.onrender.com
- key: TRUST_PROXY_HOPS
value: 1
- key: MONGODB_URI
sync: false
- key: MONGODB_DB_NAME
value: task_api
- key: JWT_SECRET
generateValue: true
- key: JWT_EXPIRES_IN
value: 1h
- key: JWT_ISSUER
value: task-api-express
- key: JWT_AUDIENCE
value: task-api-client
- key: CORS_ORIGIN
value: https://task-manager-frontend-reemplaza.onrender.com
- key: AUTH_RATE_LIMIT_WINDOW_MS
value: 900000
- key: AUTH_RATE_LIMIT_MAX
value: 10
- type: web
name: task-client-react-reemplaza
runtime: static
buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm client:build
staticPublishPath: ./client/dist
envVars:
- key: NODE_VERSION
value: 24.21.0
- key: VITE_API_URL
sync: false
routes:
- type: rewrite
source: /*
destination: /index.html